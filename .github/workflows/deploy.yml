name: Deploy to Netlify

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

# Only one production deploy at a time; newer pushes cancel in-flight runs.
concurrency:
  group: netlify-production
  cancel-in-progress: true

jobs:
  deploy:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v5

      - name: Set up Node
        uses: actions/setup-node@v5
        with:
          node-version: '22'

      - name: Install dependencies
        run: npm ci

      # The app is plain HTML/CSS/JS, so we stage just the web files to deploy.
      # This keeps .git, README, and the legacy .gs script off the live site.
      - name: Stage static site
        run: |
          mkdir -p dist/clients
          cp index.html styles.css config.js setup.js app.js view.js admin.js netlify.toml dist/
          cp clients/* dist/clients/
          # Cache-bust assets (Cloudflare overrides our no-cache with a 4h browser TTL)
          sed -i "s/__BUILD__/${GITHUB_SHA}/g" dist/index.html dist/clients/form.html dist/clients/view.html

      - name: Deploy to Netlify (production)
        run: npx --yes netlify-cli@latest deploy --prod --dir=dist
        env:
          NETLIFY_AUTH_TOKEN: ${{ secrets.NETLIFY_AUTH_TOKEN }}
          NETLIFY_SITE_ID: ${{ secrets.NETLIFY_SITE_ID }}
