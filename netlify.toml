# Netlify configuration — static site + serverless functions, no build step.
# The form is plain HTML/CSS/JS; the functions handle saving/reading responses.
[build]
  publish = "dist"

[functions]
  directory = "netlify/functions"

# Purge saved drafts after their 30-day lifetime.
[functions."cleanup-drafts"]
  schedule = "@daily"

# Clean API paths: /api/submit -> /.netlify/functions/submit
[[redirects]]
  from = "/api/*"
  to = "/.netlify/functions/:splat"
  status = 200

# Sensible headers for a public review prototype.
[[headers]]
  for = "/*"
  [headers.values]
    X-Frame-Options = "SAMEORIGIN"
    Referrer-Policy = "strict-origin-when-cross-origin"

# Long-cache static assets; keep HTML fresh so reviewers always get the latest.
[[headers]]
  for = "/*.css"
  [headers.values]
    Cache-Control = "public, max-age=3600"

[[headers]]
  for = "/*.js"
  [headers.values]
    Cache-Control = "public, max-age=3600"

# Never cache anything that could contain client data.
[[headers]]
  for = "/view.html"
  [headers.values]
    Cache-Control = "no-store"

[[headers]]
  for = "/admin.html"
  [headers.values]
    Cache-Control = "no-store"
