# Netlify configuration — static site + serverless functions, no build step.
# The form is plain HTML/CSS/JS; the functions handle saving/reading responses.
[build]
  publish = "dist"

[functions]
  directory = "netlify/functions"

# Purge saved drafts after their 30-day lifetime.
[functions."cleanup-drafts"]
  schedule = "@daily"

# Office-only API — these sit behind Cloudflare Access at /api/*.
[[redirects]]
  from = "/api/*"
  to = "/.netlify/functions/:splat"
  status = 200

# Public client API under /clients/api/* (outside the Access zone). Listed
# explicitly, not as a wildcard, so /clients/api/admin cannot reach the office
# functions through the public path.
[[redirects]]
  from = "/clients/api/submit"
  to = "/.netlify/functions/submit"
  status = 200

[[redirects]]
  from = "/clients/api/get"
  to = "/.netlify/functions/get"
  status = 200

[[redirects]]
  from = "/clients/api/draft"
  to = "/.netlify/functions/draft"
  status = 200

[[redirects]]
  from = "/clients/api/upload"
  to = "/.netlify/functions/upload"
  status = 200

[[redirects]]
  from = "/clients/api/file"
  to = "/.netlify/functions/file"
  status = 200

[[redirects]]
  from = "/clients/api/round"
  to = "/.netlify/functions/round"
  status = 200

# Old flat client URLs -> new /clients/ paths.
[[redirects]]
  from = "/form.html"
  to = "/clients/form.html"
  status = 301
  force = true

[[redirects]]
  from = "/view.html"
  to = "/clients/view.html"
  status = 301
  force = true

# The dashboard moved to the site root; keep old bookmarks working.
[[redirects]]
  from = "/admin.html"
  to = "/"
  status = 301
  force = true

# Sensible headers for a public review prototype.
[[headers]]
  for = "/*"
  [headers.values]
    X-Frame-Options = "SAMEORIGIN"
    Referrer-Policy = "strict-origin-when-cross-origin"

# Static assets revalidate on every load so a deploy is picked up immediately
# (the HTML itself is no-store).
[[headers]]
  for = "/*.css"
  [headers.values]
    Cache-Control = "no-cache"

[[headers]]
  for = "/*.js"
  [headers.values]
    Cache-Control = "no-cache"

# Never cache anything that could contain client data.
[[headers]]
  for = "/clients/form.html"
  [headers.values]
    Cache-Control = "no-store"

[[headers]]
  for = "/clients/view.html"
  [headers.values]
    Cache-Control = "no-store"

# The dashboard is the site root (behind Cloudflare Access); always fresh.
[[headers]]
  for = "/"
  [headers.values]
    Cache-Control = "no-store"

[[headers]]
  for = "/index.html"
  [headers.values]
    Cache-Control = "no-store"
