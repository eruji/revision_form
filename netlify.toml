# Netlify configuration — static site + serverless functions, no build step.
# The form is plain HTML/CSS/JS; the functions handle saving/reading responses.
[build]
  publish = "dist"

[functions]
  directory = "netlify/functions"

# Purge saved drafts after their 30-day lifetime.
[functions."cleanup-drafts"]
  schedule = "@daily"

# Clean API paths: /api/submit -> /.netlify/functions/submit
[[redirects]]
  from = "/api/*"
  to = "/.netlify/functions/:splat"
  status = 200

# The dashboard moved to the site root; keep old bookmarks working.
[[redirects]]
  from = "/admin.html"
  to = "/"
  status = 301
  force = true

# Sensible headers for a public review prototype.
[[headers]]
  for = "/*"
  [headers.values]
    X-Frame-Options = "SAMEORIGIN"
    Referrer-Policy = "strict-origin-when-cross-origin"

# Static assets revalidate on every load so a deploy is picked up immediately
# (the HTML itself is no-store).
[[headers]]
  for = "/*.css"
  [headers.values]
    Cache-Control = "no-cache"

[[headers]]
  for = "/*.js"
  [headers.values]
    Cache-Control = "no-cache"

# Never cache anything that could contain client data.
[[headers]]
  for = "/view.html"
  [headers.values]
    Cache-Control = "no-store"

# The dashboard is now the site root (password protected); always serve it fresh.
[[headers]]
  for = "/"
  [headers.values]
    Cache-Control = "no-store"

[[headers]]
  for = "/index.html"
  [headers.values]
    Cache-Control = "no-store"

[[headers]]
  for = "/form.html"
  [headers.values]
    Cache-Control = "no-store"
